server:
    address: 0.0.0.0
    port: 2333

lavalink:
    server:
        password: "${LAVALINK_PASSWORD}"
        sources:
            bandcamp: true
            http: true
            local: false
            soundcloud: true
            twitch: true
            vimeo: true
            youtube: false
        bufferDurationMs: 400
        frameBufferDurationMs: 5000
        youtubePlaylistLoadLimit: 6
        playerUpdateInterval: 5
    plugins:
        - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
          snapshot: false
        - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
          snapshot: false

plugins:
    youtube:
        enabled: true
        allowSearch: true
        allowDirectVideoIds: true
        allowDirectPlaylistIds: true
    lavasrc:
        providers:
            - "ytsearch:\"%ISRC%\""
            - "ytsearch:%QUERY%"
        sources:
            spotify: true
            applemusic: false
            deezer: false
            yandexmusic: false
            flowerytts: false
            youtube: false
            vkmusic: false
            tidal: false
            qobuz: false
            ytdlp: false
            jiosaavn: false
        spotify:
            clientId: "${SPOTIFY_CLIENT_ID:}"
            clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
